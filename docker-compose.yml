
services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - main-db
      - redis

  main-db:
    image: postgres:17
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
  read-replica:
    image: postgres:17
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
  

  redis:
    image: redis:7
    ports:
      - "6379:6379"