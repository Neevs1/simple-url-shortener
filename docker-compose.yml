
services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env


  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
  

  redis:
    image: redis:7
    ports:
      - "6379:6379"